[project]
name = "invoice-pipeline"
version = "0.1.0"
description = "Invoice PDFs -> validated rows -> Google Sheets, idempotent and resumable (portfolio demo)"
authors = [{ name = "Elmar Guliyev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10",
    "numpy>=1.26",
    "pydantic>=2.7",
    "gspread>=6.1",
    "google-auth>=2.29",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
invoice-pipeline = "invoice_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4.2", "faker>=25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
